<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Bahia 2026 em Pauta</title>
<meta name="description" content="Perfis, posicionamentos, votos nominais, pesquisas e produtividade dos políticos da Bahia em 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: painel de consulta — sidebar fixa, busca no topo, cada seção dividida em abas.
   Cor: neutros frios quase sem saturação; um verde-petróleo como acento; campos políticos com cores próprias. */
:root {
  --bg: #f6f7f8;
  --surface: #ffffff;
  --surface-2: #eff2f3;
  --ink: #16212a;
  --muted: #5d6a73;
  --line: #e3e7ea;
  --accent: #0b6f69;
  --accent-soft: #e1f0ee;
  --ochre: #b27812;
  --gov: #c0412b; --gov-soft: #f8e5e1;
  --op: #2c5aa8; --op-soft: #e2e9f6;
  --out: #75639a; --out-soft: #ebe7f3;
  --nd: #7d8a90; --nd-soft: #eceff1;
  --yes: #26734a; --yes-soft: #e0f1e6;
  --no: #b33a2a; --no-soft: #f8e3df;
  --abs: #93660b; --abs-soft: #f6ecd6;
  --off: #6f7b82; --off-soft: #eceff1;
  --shadow: 0 10px 30px rgba(22, 33, 42, .12);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --side-w: 244px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #191c20; --surface-2: #21252a; --ink: #e7e9ec; --muted: #9ba3ad; --line: #2a2f36;
    --accent: #5fb8ae; --accent-soft: #1b2b2a; --ochre: #d9a441;
    --gov: #ef8a74; --gov-soft: #33221f; --op: #8eaef0; --op-soft: #1e2839; --out: #b9a6de; --out-soft: #29243a; --nd: #98a2ab; --nd-soft: #25292e;
    --yes: #6fcf97; --yes-soft: #1b3025; --no: #f08a7a; --no-soft: #3a2220; --abs: #e3b65c; --abs-soft: #352c18; --off: #98a2ab; --off-soft: #25292e;
    --shadow: 0 12px 36px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #191c20; --surface-2: #21252a; --ink: #e7e9ec; --muted: #9ba3ad; --line: #2a2f36;
  --accent: #5fb8ae; --accent-soft: #1b2b2a; --ochre: #d9a441;
  --gov: #ef8a74; --gov-soft: #33221f; --op: #8eaef0; --op-soft: #1e2839; --out: #b9a6de; --out-soft: #29243a; --nd: #98a2ab; --nd-soft: #25292e;
  --yes: #6fcf97; --yes-soft: #1b3025; --no: #f08a7a; --no-soft: #3a2220; --abs: #e3b65c; --abs-soft: #352c18; --off: #98a2ab; --off-soft: #25292e;
  --shadow: 0 12px 36px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
html.modal-open, html.modal-open body { overflow: hidden; }
body { margin: 0; font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.1rem); font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
h4 { font-size: .95rem; font-weight: 700; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.2em; }
li + li { margin-top: .3em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num, td.n, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.xs { font-size: .74rem; }
.fw5 { font-weight: 500; }
.mt { margin-top: 6px; }
.eyebrow { font: 600 .7rem/1.3 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.prose { max-width: 74ch; }
.flow { display: flex; flex-direction: column; gap: 10px; }

/* botão-texto (nomes clicáveis) */
.nm { background: none; border: 0; padding: 0; margin: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; }
.nm:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.nmrow { display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; }

/* ---------- moldura ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface);
  border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 24px; padding: 22px 14px;
}
.brand { display: flex; align-items: center; gap: 11px; padding-inline: 8px; }
.brand-mark { font: 800 1.05rem/1 var(--f-display); color: var(--surface); background: var(--accent); width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; position: relative; flex: none; }
.brand-mark small { position: absolute; right: 4px; bottom: 3px; font-size: .5rem; font-weight: 700; opacity: .85; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.15; }
.brand-txt strong { font: 800 1rem var(--f-display); }
.brand-txt em { font-style: normal; color: var(--muted); font-size: .82rem; }
#nav { display: flex; flex-direction: column; gap: 2px; }
#nav button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); background: none; border: 0; width: 100%; text-align: left; cursor: pointer; font: 600 .9rem/1.3 var(--f-body); }
#nav button .n { font: 500 .72rem var(--f-mono); width: 1.3em; flex: none; opacity: .7; }
#nav button:hover { background: var(--surface-2); color: var(--ink); }
#nav button.on { background: var(--surface-2); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
#nav button.on .n { color: var(--accent); opacity: 1; }
.side-foot { margin-top: auto; font-size: .76rem; color: var(--muted); display: flex; flex-direction: column; gap: 12px; padding-inline: 8px; }
.legend { display: flex; flex-direction: column; gap: 5px; }
.legend span { display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.gov { background: var(--gov); } .dot.op { background: var(--op); } .dot.out { background: var(--out); } .dot.nd { background: var(--nd); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 10px clamp(16px, 3vw, 40px); background: var(--bg); border-bottom: 1px solid var(--line);
}
.menu-btn { display: none; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer; }
.menu-btn span { display: block; width: 18px; height: 2px; background: var(--ink); border-radius: 2px; }
.theme-btn { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; font-size: 1.05rem; flex: none; }
.gsearch { position: relative; flex: 1; max-width: 560px; }
.gsearch svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); }
.gsearch input { width: 100%; height: 40px; padding: 0 14px 0 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 .92rem var(--f-body); }
.gresults { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; padding: 6px; }
.gresults button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border: 0; background: none; color: var(--ink); border-radius: 7px; cursor: pointer; font: inherit; }
.gresults button:hover, .gresults button.hl { background: var(--surface-2); }
.gresults .kind { font: 600 .66rem var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-left: auto; flex: none; }
.gresults .empty { padding: 10px; color: var(--muted); }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 29; }

#content { padding: 28px clamp(16px, 3vw, 40px) 64px; min-width: 0; max-width: 1320px; }
.sec { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.sec-head { display: flex; flex-direction: column; gap: 8px; }
.sec-head p { color: var(--muted); max-width: 80ch; }
.block { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.block-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.note { background: var(--surface-2); padding: 12px 14px; border-radius: 10px; font-size: .9rem; color: var(--ink); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }

/* abas */
.tabs { display: flex; gap: 4px; box-shadow: inset 0 -1px 0 var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; margin-bottom: 20px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; background: none; padding: 10px 12px; font: 600 .88rem var(--f-body); color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.tcount { font: 500 .72rem var(--f-mono); color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
.tab-body { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* chips e selos */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font: 600 .72rem/1.5 var(--f-body); white-space: nowrap; }
.pill.gov { background: var(--gov-soft); color: var(--gov); }
.pill.op { background: var(--op-soft); color: var(--op); }
.pill.out { background: var(--out-soft); color: var(--out); }
.pill.nd { background: var(--nd-soft); color: var(--muted); }
.pill.lead { background: var(--ochre); color: var(--surface); letter-spacing: .04em; }
.pill.lead.sm { font-size: .6rem; padding: 0 6px; }
.pill.party { background: var(--surface-2); color: var(--ink); }
.pill.tag { background: var(--surface-2); color: var(--ink); font-weight: 500; }
.v { display: inline-block; padding: 1px 7px; border-radius: 5px; font: 600 .77rem/1.5 var(--f-body); white-space: nowrap; }
.v.wrap { white-space: normal; }
.v.yes { background: var(--yes-soft); color: var(--yes); }
.v.no { background: var(--no-soft); color: var(--no); }
.v.abs, .v.cit { background: var(--abs-soft); color: var(--abs); }
.v.off { background: var(--off-soft); color: var(--off); }
.v.dash { color: var(--muted); padding-inline: 2px; }
.v.txt { white-space: normal; background: var(--surface-2); color: var(--ink); font-weight: 500; }

/* bandeirinhas de partido (cores e número de urna; não são os logotipos oficiais) */
.flag { display: inline-flex; align-items: center; gap: 5px; font: 600 .78rem/1.4 var(--f-body); white-space: nowrap; vertical-align: middle; color: var(--ink); }
.flag i { display: inline-grid; place-items: center; width: 26px; height: 17px; border-radius: 3px; font: 700 .62rem/1 var(--f-mono); font-style: normal; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); flex: none; text-shadow: 0 0 2px rgba(0,0,0,.55); }
.flag.lg i { width: 36px; height: 24px; font-size: .78rem; }
.flag.lg { font-size: .9rem; }
.flags { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi .big { font: 800 1.75rem/1.1 var(--f-display); letter-spacing: -.02em; }
.kpi .big small { font-size: .85rem; font-weight: 600; color: var(--muted); margin-left: 4px; }
.kpi p { font-size: .84rem; color: var(--muted); }

/* barras de pesquisa */
.poll { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr) 72px; align-items: center; gap: 12px; }
.bar-row .who { display: flex; flex-direction: column; gap: 2px; line-height: 1.2; font-size: .92rem; }
.bar-row .who small { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.track { position: relative; height: 20px; background: var(--surface-2); border-radius: 5px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; transition: width .5s ease; }
.fill.gov { background: var(--gov); } .fill.op { background: var(--op); } .fill.out { background: var(--out); } .fill.nd { background: var(--nd); }
.moe { position: absolute; top: 4px; bottom: 4px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); opacity: .5; }
.moe::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px solid var(--ink); }
.ghost { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dashed var(--muted); }
.cut { position: absolute; top: -8px; bottom: -8px; border-left: 2px dotted var(--ochre); }
.bar-row .val { font: 500 .9rem var(--f-mono); text-align: right; }
.delta { font: 500 .72rem var(--f-mono); display: block; }
.delta.up { color: var(--yes); } .delta.down { color: var(--no); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: var(--surface); gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; font: 600 .82rem var(--f-body); color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface-2); color: var(--ink); }
.chart-foot { font-size: .78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.chart-foot i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.lg-moe { width: 16px; height: 9px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); opacity: .6; }
.lg-ghost { width: 0; height: 12px; border-left: 2px dashed var(--muted); }
.lg-cut { width: 0; height: 12px; border-left: 2px dotted var(--ochre); }
.inst { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.inst .card { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.duo { display: flex; flex-direction: column; gap: 6px; }
.duo > div { display: grid; grid-template-columns: 80px 1fr 50px; gap: 8px; align-items: center; font-size: .84rem; }
.duo .t { height: 10px; background: var(--surface-2); border-radius: 3px; position: relative; }
.duo .t span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }

/* grade de pautas (visão geral) */
.pauta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 8px; }
.pchip { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: 600 .88rem/1.3 var(--f-body); cursor: pointer; }
.pchip:hover { border-color: var(--accent); }

/* filtros */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld label { font: 600 .68rem var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.fld select, .fld input { height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 0 10px; font: 500 .88rem var(--f-body); max-width: 100%; }
.fld input { min-width: 200px; }
.btn { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: 600 .84rem var(--f-body); cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.count { font-size: .84rem; color: var(--muted); }
details.more > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: .88rem; }
details.more[open] > summary { margin-bottom: 10px; }

/* tabelas */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
thead th { position: sticky; top: 0; background: var(--surface-2); font: 600 .72rem/1.3 var(--f-body); letter-spacing: .03em; color: var(--muted); z-index: 1; }
th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
th.sortable::after { content: " ↕"; opacity: .4; }
th.sortable.asc::after { content: " ↑"; opacity: 1; color: var(--accent); }
th.sortable.desc::after { content: " ↓"; opacity: 1; color: var(--accent); }
td.n, th.n { text-align: right; white-space: nowrap; }
tbody tr:hover td { background: var(--surface-2); }
.matrix td { min-width: 120px; }
.matrix td:first-child, .matrix th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 2; min-width: 160px; box-shadow: 1px 0 0 var(--line); }
.matrix thead th:first-child { background: var(--surface-2); z-index: 3; }
.matrix tbody tr:hover td:first-child { background: var(--surface-2); }
td.colhi { background: var(--accent-soft); }
td.hi-max { box-shadow: inset 0 -2px 0 var(--yes); }
td.hi-min { box-shadow: inset 0 -2px 0 var(--no); }
tr.partial td { color: var(--muted); }

/* pautas: lista + detalhe */
.pl-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: start; }
.pl-list { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 4px; }
.pl-list .fld input { min-width: 0; width: 100%; }
.pl-items { display: flex; flex-direction: column; gap: 2px; }
.pl-items button { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; color: var(--ink); font: 600 .88rem/1.3 var(--f-body); cursor: pointer; }
.pl-items button small { display: block; font: 400 .74rem var(--f-mono); color: var(--muted); margin-top: 2px; }
.pl-items button:hover { background: var(--surface-2); }
.pl-items button.on { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent), 0 0 0 1px var(--line); }
.pl-group { display: flex; flex-direction: column; gap: 4px; }
.pl-group + .pl-group { margin-top: 8px; }
.pl-group > .eyebrow { padding-inline: 10px; }
.vsum { display: flex; flex-wrap: wrap; gap: 8px; }
.vsum-i { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 6px 10px; font: 600 .84rem var(--f-body); cursor: pointer; }
.vsum-i i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.vsum-i b { font-size: 1rem; }
.vsum-i:hover { border-color: var(--accent); }
.vsum-i.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.vdot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 7px; }
.nd-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 6px; display: inline-block; }
.nd-dot.sim { background: var(--yes); } .nd-dot.parcial { background: var(--abs); } .nd-dot.nao { background: var(--off); }
.legend-n { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.legend-n .nd-dot { margin-top: 0; }
.pl-detail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(16px, 2.4vw, 26px); min-width: 0; }
.pl-detail > .flow { gap: 18px; }
.pl-detail .ref { font: 500 .78rem var(--f-mono); color: var(--muted); }

      c: `Sem declaração sobre a PEC. O plano de governo prevê uma "Governadoria da Segurança", com o governador no comando direto das operações. Também propõe bloqueio de comunicação nos presídios, reconhecimento facial, drones, melhoria salarial negociada e moradia para policiais ([BN](https://www.bahianoticias.com.br/noticia/319491-acm-neto-propoe-governadoria-da-seguranca-e-metas-de-reducao-de-homicidios-em-plano-de-governo-na-bahia)). A ênfase é no comando estadual. Caiado, o candidato presidencial que ele apoia, é um dos críticos mais duros da PEC.`,
      d: "Propõe regionalizar os serviços para reduzir o deslocamento de pacientes à capital e reestruturar a regulação para zerar filas nas emergências (\"Fila Zero\"). Não há registro sobre piso da enfermagem ou gestão privada de hospitais.",
      e: "Sem posicionamento registrado.",
      f: `Sem posicionamento registrado. Contexto: a prefeitura de Salvador, comandada pelo aliado Bruno Reis, tem uma casa de apostas como patrocinadora do Carnaval ([BN](https://www.bahianoticias.com.br/holofote/noticia/84466-justica-da-bahia-impoe-restricoes-a-publicidade-de-bets-no-sao-joao-financiado-com-dinheiro-publico)).`,
      g: "Sem posicionamento registrado.",
      h: `Vê as facções como terror, mas ressalva a soberania. Depois de os EUA classificarem PCC e CV como terroristas, disse que defende a soberania nacional. Afirmou também que o que as facções fazem no dia a dia "é terror" e que é a favor de "todas as medidas que botem pra quebrar no PCC e CV" ([BN](https://www.bahianoticias.com.br/noticia/317421-acm-neto-defende-soberania-e-diz-que-faccoes-fazem-terror-sou-a-favor-de-todas-as-medidas-que-botem-pra-quebrar-no-pcc-e-cv)). Criticou os deputados aliados de Jerônimo que votaram contra o PL Antifacção ([Correio](https://www.correio24horas.com.br/politica/acm-neto-critica-aliados-de-jeronimo-que-votaram-contra-projeto-antifaccao-deixaram-claro-que-nao-querem-tratar-bandido-como-bandido-1125)).`,
      i: "Sem posicionamento registrado."
    },
    extras: [["Letalidade policial e câmeras", "Não localizada declaração sobre câmeras corporais ou letalidade. O plano dele aposta em comando direto do governador, reconhecimento facial e drones."], ["Fiol e Porto Sul", "Não localizada declaração recente específica."]]

  { id: "jeronimo", nome: "Jerônimo Rodrigues", cargo: "gov", partido: "PT", sigla: "PT", campo: "gov", espectro: "Centro-esquerda", poll: "42,0% (governo, set.)",
    ident: `Nome completo: Jerônimo Rodrigues Souza. Partido: PT. Estado: Bahia. Cargo atual: governador desde 2023, candidato à reeleição com Geraldo Jr. (MDB) de vice ([CNN](${U.cnnCand})).`,
    trajetoria: [
      "Engenheiro agrônomo e professor universitário, nascido em Aiquara. Foi secretário de Desenvolvimento Rural e de Educação da Bahia. No governo Dilma, foi secretário nacional de Desenvolvimento Territorial.",
      "Nunca tinha disputado eleição antes de 2022, quando venceu ACM Neto no 2º turno como aposta de Rui Costa. É o primeiro governador autodeclarado indígena do país.",
      `Na pesquisa de setembro, 56,1% aprovam a gestão dele, e o PT governa o estado desde 2007 ([Paraná Pesquisas](${U.parana})).`
    ],
    espectroTxt: `Centro-esquerda (PT). Está alinhado ao governo Lula, que usa como vitrine da campanha, e compõe o "Time de Lula" com Rui Costa e Jaques Wagner. Teve atritos com a direita: em 2025, pediu desculpas depois de dizer que bolsonaristas deveriam ir "para a vala" ([Rede Onda](${U.redeOnda})).`,
    aliancas: [["Presidência", "Lula (PT)."], ["Senado", "Rui Costa e Jaques Wagner, ambos do PT."], ["Presidências da Câmara e do Senado", "Sem posicionamento registrado."]],
    atencao: `Manteve no cargo um secretário investigado e minimizou a polêmica sobre contratos do estado com o Banco Master ([BN](https://www.bahianoticias.com.br/noticia/319657-jeronimo-banca-permanencia-de-secretario-investigado-e-minimiza-polemica-sobre-contratos-com-o-banco-master)).`,
    temas: {
      a: "Sem posicionamento ou voto registrado.",
      b: `A favor de explorar as terras raras na Bahia. Na Exposibram 2025, disse que elas podem transformar o estado e prometeu investimentos ligados à transição energética ([Itatiaia](${U.itatiaia})). Sem voto, porque não tem mandato legislativo.`,
      c: `Atribui a violência na Bahia ao crime organizado nacional e defende mais presença da União nas fronteiras. Essa lógica é a mesma da PEC, que amplia a coordenação federal. Sobre a letalidade policial, foram 1.490 mortes em ações policiais em 2025. Ele diz que "o Estado não pode ser um Estado matador" e cita o fortalecimento de corregedorias e ouvidorias e o programa "Bahia pela Paz" ([Poder360](${U.poderJer})).`,
      d: "Sem posicionamento específico registrado sobre piso da enfermagem, emendas ou gestão privada de hospitais.",
      e: "A favor. Em 2/9, defendeu a jornada 5x2 sem redução salarial como prioridade ([JGB](https://jornalgrandebahia.com.br/?p=1382645)).",
      f: "Sem posicionamento próprio registrado. O aliado Lula decretou a proibição por MP em 25/9.",
      g: "Sem posicionamento registrado.",
      h: "Sem declaração própria localizada. O governo Lula, aliado dele, é contra a equiparação, por risco à soberania. Jerônimo defende mais atuação da União contra o crime organizado nacional.",
      i: "Sem posicionamento registrado."
    },
    extras: [["Letalidade policial e câmeras", "O governo dele implantou as câmeras, e o secretário de Segurança atribui a queda a tecnologia e treinamento. Jerônimo diz que o Estado não pode ser \"matador\" e cita corregedorias e o programa Bahia pela Paz."], ["PEC da Blindagem", "Criticou os aliados que apoiaram a PEC ([BNews](https://www.bnews.com.br/noticias/politica/jeronimo-rodrigues-reage-deputados-que-votaram-favor-da-pec-da-blidagem-eu-nao-sei-o-que-passou-na-cabeca.html))."], ["Empréstimos (AL-BA)", "Autor dos pedidos de crédito: cerca de R$ 26 bilhões em 22 pedidos desde 2023, todos aprovados."], ["Fiol e Porto Sul", "Não localizada declaração recente específica."]]

  { id: "rui-costa", nome: "Rui Costa", cargo: "sen", partido: "PT", sigla: "PT", campo: "gov", espectro: "Centro-esquerda", lidera: true, poll: "46,3% das menções (Senado, set.)",
    ident: `Nome: Rui Costa dos Santos. Partido: PT. Estado: Bahia. Cargo atual: nenhum. Foi ministro-chefe da Casa Civil de 2023 até deixar o cargo, no prazo legal de abril de 2026, para disputar o Senado ([Poder360](https://www.poder360.com.br/poder-eleicoes/rui-costa-confirma-que-deixara-governo-para-disputar-senado/)).`,
    trajetoria: ["Economista formado no movimento sindical do Polo de Camaçari. Foi vereador de Salvador, deputado federal e secretário nos governos de Jaques Wagner.", "Governou a Bahia por dois mandatos, de 2015 a 2022, e fez de Jerônimo Rodrigues seu sucessor. Na Casa Civil, foi um dos principais articuladores do governo Lula.", `Lidera todas as pesquisas para o Senado. No levantamento de setembro, tem 46,3% das menções ([Paraná Pesquisas](${U.parana})).`],
    espectroTxt: "Centro-esquerda (PT). O perfil é mais gestor que ideológico. Na campanha, dá peso à segurança pública, com mais presídios de segurança máxima, e a programas sociais federais como o Gás do Povo.",
    aliancas: [["Presidência", "Lula."], ["Governo", "Jerônimo Rodrigues."], ["Senado", "Dobradinha com Jaques Wagner."], ["Presidência do Senado", "Sem posicionamento registrado."]],
    temas: {
      a: "Sem posicionamento pessoal ou voto registrado. A MP que zerou a taxa foi editada em maio de 2026, depois que ele deixou a Casa Civil.",
      b: "Sem posicionamento pessoal ou voto registrado.",
      c: `A favor da coordenação federal. Como ministro, participou em 2024 do lançamento da PEC com governadores e disse que o governo iria "sistematizar" as propostas de segurança em tramitação ([O Povo](https://www.opovo.com.br/noticias/politica/2024/10/31/governador-de-sp-sugere-ampliar-propostas-para-a-seguranca-publica.html)). Na campanha, defende ampliar as penitenciárias federais, transformar unidades baianas em presídios de segurança máxima e mudar a Lei de Execução Penal ([JGB](https://jornalgrandebahia.com.br/?p=1385782)).`,
      d: "Propõe levar residências médicas ao interior para ampliar a oferta de especialistas fora dos grandes centros ([JGB](https://jornalgrandebahia.com.br/2026/08/ex-ministro-rui-costa-coloca-creches-ensino-integral-execucao-penal-e-residencias-medicas-entre-prioridades-para-o-senado/)).",
      e: "Sem declaração pessoal encontrada. Integra a chapa de Lula, que tem a 6x1 como bandeira. Se eleito, votaria a PEC caso ela fique para 2027.",
      f: "Sem posicionamento pessoal registrado.",
      g: "Sem posicionamento registrado.",
      h: "Sem declaração própria localizada. O governo federal, do qual foi ministro até abril, é contra a equiparação.",
      i: "Sem posicionamento registrado."
    },
    extras: [["Fiol e Porto Sul", "Como ministro da Casa Civil, anunciou em 2025 orçamento para concluir a Fiol 2 em 2026 e disse que o governo buscava investidores para salvar a Bamin ([BP Money](https://bpmoney.com.br/brasil/rui-costa-anuncia-orcamento-para-fiol))."], ["Produtividade", "Sem mandato no Senado."]]
  },
  { id: "jaques-wagner", nome: "Jaques Wagner", cargo: "sen", partido: "PT", sigla: "PT", campo: "gov", espectro: "Centro-esquerda", lidera: true, poll: "34,0% das menções (Senado, set.)",
    ident: "Nome: Jaques Wagner. Partido: PT. Estado: Bahia. Cargo atual: senador desde 2019. Busca a reeleição.",
    trajetoria: [`Foi deputado federal e ministro do Trabalho, da Defesa e da Casa Civil. Governou a Bahia de 2007 a 2014 e deu início à hegemonia do PT no estado. Foi eleito senador em 2018 ([BN](${U.bnSenCand})).`, `Foi líder do governo Lula no Senado até 24/6/2026. Deixou o posto dias depois de ser alvo da 9ª fase da Operação Compliance Zero, da PF, que investiga fraudes do Banco Master. Wagner nega as suspeitas, não foi denunciado e não é réu ([SBT News](https://sbtnews.sbt.com.br/noticia/politica/jaques-wagner-deixa-lideranca-do-governo-no-senado-1)).`, "Na Quaest, caiu de 22% em abril para 16% em julho. Na Paraná Pesquisas de setembro, está em 2º lugar, com 34,0% das menções."],
    espectroTxt: "Centro-esquerda (PT). Tem perfil de articulador e negociador com o centro. Por anos, foi o principal operador do governo no Senado.",
    aliancas: [["Presidência", "Lula."], ["Governo", "Jerônimo Rodrigues."], ["Senado", "Dobradinha com Rui Costa."], ["Presidência do Senado", "Sem declaração verificada nesta pesquisa."]],
    atencao: "Alvo da 9ª fase da Operação Compliance Zero (PF), que investiga fraudes do Banco Master. Nega as suspeitas, não foi denunciado e não é réu.",
    temas: {
      a: `Atuou para aprovar a taxa em 2024. Como líder do governo, pediu verificação nominal na votação do texto-base do Mover. Segundo a revista Oeste, a manobra evitou a votação nominal do destaque que devolveu a taxa ao projeto. Assim, os senadores aprovaram a cobrança sem registro individual ([Oeste](https://revistaoeste.com/politica/contrariando-relator-senado-aprova-taxacao-das-blusinhas/)). Sobre o fim da taxa em 2026: sem voto nominal registrado.`,
      b: `Sem voto nominal, porque a aprovação foi simbólica. Apresentou o REQ 13/2026 na Comissão de Relações Exteriores para ampliar os convidados da audiência sobre regulação do setor, realizada em 2/6/2026 ([Senado](${U.senadoReq13})). Esteve presente na audiência da CAE sobre o tema em 1/7/2025 ([ata](${U.ataCAE})).`,
      c: "Como líder, representava o governo, autor da PEC. No Senado, só a CCJ votou, de forma simbólica. Sem voto nominal registrado.",
      d: "Sem posicionamento registrado.",
      e: "A PEC era prioridade do governo que ele liderava no Senado. Sem voto nominal registrado, porque o plenário ainda não votou.",
      f: "Sem posicionamento pessoal registrado.",
      g: "Sem voto ou posicionamento registrado.",
      h: `Sem voto nominal registrado. A emenda de Girão caiu em votação simbólica em 10/12/2025. Wagner não está entre os que declararam voto favorável ([Folha/BN](${U.folhaFaccoes})).`,
      i: `Contra ampliar o acesso, mas negociou com a bancada da bala. Em 2019, votou pela suspensão dos decretos de Bolsonaro que ampliavam posse e porte. Na ocasião, lembrou as mortes de jovens que viu como governador ([BN](${U.bnArmas2019})). Em 2024, como líder do governo, pediu o adiamento do PDL que derrubava partes do decreto de Lula e anunciou um novo decreto com concessões à bancada da bala ([Portal de Prefeitura](https://portaldeprefeitura.com.br/brasil/bancada-da-bala-cobra-lewandowski-sobre-decreto-de-liberacao-de-armas/584664/)).`
    },
    extras: [["PL da Dosimetria (veto, 30/4/2026)", "Não votou."]],
    senProd: { prop: "2021: cerca de 53 proposições de autoria e 6 relatorias", assid: "2026: não está entre os dez senadores que mais deixaram de votar até 22/6 (o 10º, Renan Calheiros, faltou a 41%)", obs: "Foi líder do governo até 24/6/2026." }
  },
  { id: "joao-roma", nome: "João Roma", cargo: "sen", partido: "PL", sigla: "PL", campo: "op", espectro: "Direita", poll: "27,3% das menções (Senado, set.)",
    ident: "Nome completo: João Inácio Ribeiro Roma Neto. Partido: PL (presidente estadual). Estado: Bahia. Cargo atual: nenhum.",
    trajetoria: [`Advogado nascido no Recife e radicado na Bahia. Começou na juventude do PFL, chefiou o escritório da ANP em Salvador e foi chefe de gabinete da prefeitura de Salvador na gestão de ACM Neto ([BN](https://www.bahianoticias.com.br/noticia/319500-joao-roma-triplica-patrimonio-em-quatro-anos-veja-dados-da-formalizacao-da-candidatura-ao-senado)).`, "Foi eleito deputado federal em 2018 e ganhou projeção nacional como ministro da Cidadania do governo Bolsonaro. Disputou o governo da Bahia em 2022 e perdeu. Declarou patrimônio de R$ 17,01 milhões, o triplo de 2022.", "Na Paraná Pesquisas de setembro, está em 3º lugar, com 27,3% das menções."],

    aliancas: [["Presidência", `Flávio Bolsonaro (PL), que apoia Roma e Coronel para o Senado ([Congresso em Foco](https://www.congressoemfoco.com.br/noticia/121480/corrida-ao-senado-na-bahia-poe-antigos-aliados-frente-a-frente)).`], ["Governo", "ACM Neto."], ["Senado", "Chapa com Angelo Coronel."]],
    temasNota: "Roma não tinha mandato durante nenhuma dessas votações.",
    temas: {
      a: "Sem posicionamento ou voto registrado.",
      b: "Sem posicionamento ou voto registrado.",
      c: `Sem posicionamento sobre a PEC. O PL orientou "sim" na Câmara. Na campanha, a segurança é o eixo principal das críticas dele ao governo do PT. Em 2022, acusou o estado de omissão diante de invasões de terra no extremo sul ([BN](https://www.bahianoticias.com.br/noticia/272268-roma-critica-rui-costa-e-afirma-que-estado-e-omisso-na-seguranca-do-extremo-sul)).`,
      d: "Sem posicionamento registrado.",
      e: `Sem posicionamento pessoal registrado. O PL no Senado apoia uma PEC alternativa de Rogério Marinho, com jornada por horas ([Folha PE](https://www.folhape.com.br/politica/romario-contraria-pl-e-anuncia-voto-a-favor-de-pec-pelo-fim-da-escala/491781/)).`,
      f: "Sem posicionamento registrado.",
      g: "Sem posicionamento registrado.",
      h: `A favor. Elogiou a decisão dos EUA de classificar PCC e CV como terroristas e a chamou de "medida importante e necessária" ([BN](https://www.bahianoticias.com.br/noticia/317402-joao-roma-elogia-classificacao-de-pcc-e-cv-como-terroristas-e-diz-que-bahia-e-retrato-da-tragedia-causada-pelas-faccoes)).`,

  { id: "angelo-coronel", nome: "Angelo Coronel", cargo: "sen", partido: "Republicanos", sigla: "Republicanos", campo: "op", espectro: "Centro-direita pragmático (centrão)", poll: "25,1% das menções (Senado, set.)",
    ident: `Nome completo: Angelo Mario Coronel de Azevedo Martins. Partido: Republicanos (até 2026, PSD). Estado: Bahia. Cargo atual: senador desde 2019. Busca a reeleição ([Agência Senado](https://www12.senado.leg.br/noticias/candidatos-2026/candidatos-2026-bahia)).`,
    trajetoria: ["Engenheiro civil e empresário de Coração de Maria, onde foi prefeito de 1989 a 1992. Foi deputado estadual por mais de duas décadas e presidiu a Assembleia Legislativa de 2017 a 2019. Foi eleito senador em 2018 pelo PSD, na chapa de Jaques Wagner.", "No Senado, presidiu a CPMI das Fake News em 2019 e foi relator do Orçamento de 2025. Também relatou a lei que regulamentou as bets, em 2023.", "Sem espaço na chapa do PT, que lançou Rui Costa e Wagner, deixou o PSD e a base de Jerônimo e entrou no Republicanos. Hoje concorre na chapa de ACM Neto. Está em 4º lugar, com 25,1% das menções."],
    espectroTxt: "Centro-direita pragmático (centrão). Esteve na base de Lula até 2025 e migrou para a oposição estadual por conveniência eleitoral. Tem posições liberais em temas econômicos, como bets e armas.",
    aliancas: [["Presidência", `Declarou apoio a Flávio Bolsonaro (PL) depois de trocar o PSD pelo Republicanos. Disse que não vê Ronaldo Caiado como nome competitivo ([Oeste](https://revistaoeste.com/politica/senador-abandona-o-pt-e-declara-apoio-a-flavio-bolsonaro/)).`], ["Governo", "ACM Neto."], ["Senado", "Chapa com João Roma."]],
    temas: {
      a: "Sem voto nominal registrado. As votações de 2024 e de 2026 no Senado foram simbólicas.",
      b: `Sem voto nominal registrado. A ata da audiência da CAE sobre minerais críticos, em 1/7/2025, o registra como ausente ([ata](${U.ataCAE})).`,
      c: "Sem voto nominal registrado. A PEC só passou pela CCJ do Senado, em votação simbólica.",
      d: "Sem posicionamento específico registrado. Como relator-geral do Orçamento de 2025, teve papel central na distribuição de emendas, mas o relatório não localizou dados por área.",
      e: "Sem declaração pública. Não está entre os 4 votos contrários na CCJ.",
      f: `A favor da regulação e contra proibir. Relatou a lei das bets, reduziu a taxação das operadoras de 18% para 12% e votou contra o relatório final da CPI das Bets. À Agência Pública, disse: "sou favorável aos jogos porque acho que o jogo é uma fonte de receita" ([Agência Pública](${U.publicaBets})).`,
      g: "Sem voto ou posicionamento registrado.",
      h: `Sem voto nominal registrado. A emenda de Eduardo Girão foi rejeitada em votação simbólica em 10/12/2025. Coronel não está entre os senadores que declararam voto favorável ([Folha/BN](${U.folhaFaccoes})).`,
      i: `Favorável a ampliar o acesso. Em 2019, foi o único senador baiano a votar contra o PDL que suspendia os decretos de Bolsonaro que ampliavam posse e porte. Na ocasião, disse: "Eu sou a favor da defesa da propriedade" ([BN](${U.bnArmas2019})). Em 2024, como relator ad hoc do PDL que derrubava partes do decreto de armas de Lula, pediu o adiamento por falta de consenso ([Oeste](https://revistaoeste.com/politica/senado-aprova-urgencia-para-derrubar-parte-do-decreto-de-armas-de-lula/)).`

<script>
(function () {
"use strict";

/* ================= utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const fmt = n => typeof n === "number" ? n.toLocaleString("pt-BR") : n;
const pct = n => n.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
function md(s) {
  let h = esc(s);
  h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/\[LIDERA\]/g, '<span class="pill lead">LIDERA</span>');
  return h;
}
const isSR = t => /^(sem (posicionamento|voto|declara)|s\/r)/i.test(String(t).trim());
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/* ================= bandeirinhas de partido =================
   Cores do partido + número de urna. Não são os logotipos oficiais. */
const PARTY = {
  PT: ["#d7191c", "#9e0f13", 13], PL: ["#1a3d8f", "#ffcc00", 22], "União": ["#1f3a93", "#f2c500", 44], PP: ["#1f5fb4", "#8cc8ff", 11], PSD: ["#1d4f91", "#f5b700", 55],
  MDB: ["#0b8a3c", "#ffd400", 15], PSB: ["#e0301e", "#ffcc00", 40], PDT: ["#d6262b", "#1d3f8f", 12], PV: ["#2e9a3f", "#ffe000", 43], PCdoB: ["#c8102e", "#ffd000", 65],
  PSOL: ["#b3001b", "#f2a900", 50], Rede: ["#00a7a0", "#f57c00", 18], Republicanos: ["#0056a4", "#6cc24a", 10], PSDB: ["#0a62b0", "#ffd200", 45], Avante: ["#f58220", "#1d4e9e", 70],
  Podemos: ["#2dab66", "#0d4f8b", 20], Solidariedade: ["#f7941d", "#1f3f99", 77], DC: ["#0e6fb8", "#6dbb45", 27], PCO: ["#b0171f", "#1a1a1a", 29], UP: ["#c8102e", "#1a1a1a", 80], Mobiliza: ["#6a2c91", "#ffcc00", 33]
};
function partyKey(s) {
  s = String(s || "").replace(/\/BA$/, "").trim();
  if (/^Uni[aã]o/.test(s)) return "União";
  if (/PSOL/.test(s)) return "PSOL";
  if (/^Rede/.test(s)) return "Rede";
  return s;
}
function flag(s, opt = {}) {
  const parts = String(s || "").replace(/\/BA$/, "").split(/,\s*/);
  return `<span class="flags">${parts.map(x => {
    const k = partyKey(x), c = PARTY[k];
    if (!c) return `<span class="pill party">${esc(x)}</span>`;
    return `<span class="flag${opt.lg ? " lg" : ""}" title="${esc(k)} · número ${c[2]}"><i style="background:linear-gradient(135deg,${c[0]} 0 58%,${c[1]} 58% 100%);color:#fff">${c[2]}</i>${opt.noName ? "" : esc(opt.label || k)}</span>`;
  }).join("")}</span>`;
}

/* ================= registro de pessoas ================= */
const PEOPLE = new Map();
const campoPill = c => `<span class="pill ${c}">${esc(CAMPOS[c] || CAMPOS.nd)}</span>`;

PERFIS.forEach(p => { if (MENORES.cands[p.id]) p.menor = MENORES.cands[p.id]; PEOPLE.set(p.id, Object.assign({ kind: "full" }, p)); });

const prodMap = new Map();
PROD_2025.forEach(r => prodMap.set(slug(r[0]), { ano: "2025", row: r, parcial: PROD_PARCIAL[r[0]] }));
PROD_SUPLENTES.forEach(r => prodMap.set(slug(r[0]), { ano: "2026 (até 29/9)", row: r, suplente: true }));

FEDERAIS.forEach(f => {
  const id = slug(f.nome);
  const naoVerif = /Alinhamento estadual não verificado/.test(f.dest || "");
  let pres = f.pres;
  if (!pres) pres = f.campo === "gov" ? "Lula (posição do bloco)" : (f.partido === "PL" ? "Flávio Bolsonaro (apoio do PL)" : (f.campo === "op" ? "Não verificado (União e PP não unificaram apoio)" : "Não informado"));
  const governador = naoVerif ? "Não verificado" : f.campo === "gov" ? "Jerônimo Rodrigues (bloco)" : f.campo === "op" ? "ACM Neto (chapa)" : "Não informado";
  PEOPLE.set(id, Object.assign({ kind: "fed", id, cargo: "fed", sigla: f.partido, espectro: f.espectro || ESPECTRO_PARTIDO[f.partido] || "Não especificado", presTxt: pres, governador }, f));
});
ESTADUAIS.forEach(e => PEOPLE.set(e.id, Object.assign({ kind: "est", cargo: "est", sigla: e.partido }, e)));
EST_CITADOS.forEach(e => { const id = e.id || slug(e.nome); PEOPLE.set(id, Object.assign({ kind: "cit", id, cargo: e.cargo || "est", sigla: e.partido, espectro: "Não informado" }, e)); });

/* votos em listas nominais, por pessoa */
const VOTE_OF = new Map();
Object.entries(VOTACOES).forEach(([key, v]) => v.grupos.forEach(g => g.nomes.forEach(n => {
  const [nome, nota] = n.split("|"); const id = slug(nome);
  if (!VOTE_OF.has(id)) VOTE_OF.set(id, {});
  VOTE_OF.get(id)[key] = { k: g.k, rot: g.rot, nota };
})));
if (VOTACOES.veto.senado) VOTACOES.veto.senado.forEach(([n, rot, k, id]) => { if (!VOTE_OF.has(id)) VOTE_OF.set(id, {}); VOTE_OF.get(id).veto = { k, rot }; });

const MATRIX_BY_ID = new Map(); MATRIZ.forEach(r => r[0] && MATRIX_BY_ID.set(r[0], r));

function personLink(id, label, extra) {
  const p = PEOPLE.get(id);
  if (!p) return `<span>${esc(label)}</span>`;
  return `<button class="nchip" data-person="${id}"><i class="dot ${p.campo || "nd"}"></i>${esc(label || p.nome)}${extra ? ` <small>${esc(extra)}</small>` : ""}</button>`;
}

/* ================= categorias de voto ================= */
const VKEYS = {
  "6x1": { t: "Fim da 6x1 (plenário, mai/26)", short: "6x1" },
  emenda: { t: "Emenda que adiava a 6x1", short: "Emenda adiamento" },
  antifac: { t: "PL Antifacção (nov/25)", short: "Antifacção" },
  maior: { t: "Maioridade penal, CCJ (jun/26)", short: "Maioridade CCJ" },
  pec18: { t: "PEC 18, CCJ (jul/25)", short: "PEC 18 CCJ" },
  bets: { t: "Bets (Agência Pública)", short: "Bets" }
};
function vcat(key, val) {
  if (val == null || val === "" || val === "—") return "dash";
  if (key === "emenda") { if (/não retirou/i.test(val)) return "yes"; if (/^Assinou/i.test(val)) return "abs"; if (/^Não assinou/i.test(val)) return "no"; }
  if (key === "bets") return /Citado/.test(val) ? "cit" : "dash";
  if (/^Sim/i.test(val)) return "yes";
  if (/^(Não votou|Ausente)/i.test(val)) return "off";
  if (/^Abst/i.test(val)) return "abs";
  if (/^Não/i.test(val)) return "no";
  return "txt";
}
const CAT_LABEL = {
  def: { yes: "Sim", no: "Não", off: "Ausente / não votou", abs: "Abstenção", txt: "Outro" },
  emenda: { yes: "Assinou e não retirou", abs: "Assinou e retirou (ou disse que retiraria)", no: "Não assinou" },
  bets: { cit: "Citado pela Pública" }
};
function vbadge(key, val) {
  const c = vcat(key, val);
  if (c === "dash") return `<span class="v dash">—</span>`;
  return `<span class="v ${c === "txt" ? "txt" : c}">${esc(val)}</span>`;
}
function listBadge(o) { return o ? `<span class="v ${o.k}">${esc(o.rot)}${o.nota ? " · " + esc(o.nota) : ""}</span>` : `<span class="v dash">—</span>`; }

/* ================= navegação ================= */
const SECS = ["visao", "pautas", "politicos", "menores", "produtividade", "matriz", "votacoes", "metodo"];
const rendered = {};
let current = null;
function show(sec) {
  if (!SECS.includes(sec)) sec = "visao";
  current = sec;
  SECS.forEach(s => { $("#sec-" + s).hidden = s !== sec; });
  $$("#nav [data-sec]").forEach(a => { const on = a.dataset.sec === sec; a.classList.toggle("on", on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (!rendered[sec]) { RENDER[sec](); rendered[sec] = true; }
  closeMenu();
  store("ba26-sec", sec);
}
function go(sec, after) {
  try { if (location.hash !== "#" + sec) history.replaceState(null, "", "#" + sec); } catch (e) { /* sandbox pode bloquear */ }
  show(sec);
  try { window.scrollTo(0, 0); } catch (e) {}
  if (after) requestAnimationFrame(after);
}
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (SECS.includes(h) && h !== current) show(h); });
$("#nav").addEventListener("click", e => { const a = e.target.closest("[data-sec]"); if (!a) return; go(a.dataset.sec); });

const side = $("#side"), scrim = $("#scrim"), menuBtn = $("#menuBtn");
function closeMenu() { side.classList.remove("open"); scrim.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); }
menuBtn.addEventListener("click", () => { const o = !side.classList.contains("open"); side.classList.toggle("open", o); scrim.hidden = !o; menuBtn.setAttribute("aria-expanded", String(o)); });
scrim.addEventListener("click", closeMenu);

/* tema */
(function () {
  const saved = store("ba26-theme");
  if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
  $("#themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nx = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nx); store("ba26-theme", nx);
  });
})();

/* delegação: abrir perfil / pauta (fora do modal) */
document.addEventListener("click", e => {
  if (e.target.closest("dialog")) return;
  const b = e.target.closest("[data-person]");
  if (b) { e.preventDefault(); openProfile(b.dataset.person); return; }
  const pj = e.target.closest("[data-pauta]");
  if (pj) { e.preventDefault(); openPauta(pj.dataset.pauta); }
});

/* abas internas de cada seção */
function subTabs(host, key, tabs, first) {
  host.innerHTML = `<div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" type="button" data-st="${k}" aria-selected="false">${t}</button>`).join("")}</div><div class="tab-body"></div>`;
  const body = $(".tab-body", host);
  const sel = k => {
    if (!tabs.some(t => t[0] === k)) k = tabs[0][0];
    $$("[data-st]", host).forEach(b => { const on = b.dataset.st === k; b.classList.toggle("on", on); b.setAttribute("aria-selected", String(on)); });
    body.innerHTML = "";
    tabs.find(t => t[0] === k)[2](body);
    store("ba26-tab-" + key, k);
  };
  $$("[data-st]", host).forEach(b => b.addEventListener("click", () => sel(b.dataset.st)));
  sel(first || store("ba26-tab-" + key) || tabs[0][0]);
  return sel;
}
const TABSEL = {};

/* ================= gráficos ================= */
function pollBars(list, opts = {}) {
  const max = opts.max || Math.max(...list.map(x => x.v)) * 1.12;
  const moe = opts.moe;
  return `<div class="poll">${list.map(x => {
    const w = x.v / max * 100;
    const prev = x.d != null ? x.v - x.d : null;
    const moeHtml = moe && x.v > 5 ? `<span class="moe" style="left:${(x.v - moe) / max * 100}%;width:${2 * moe / max * 100}%" title="Margem de erro: ${pct(x.v - moe)} a ${pct(x.v + moe)}"></span>` : "";
    const ghost = prev != null ? `<span class="ghost" style="left:${prev / max * 100}%" title="Agosto: ${pct(prev)}"></span>` : "";
    const delta = x.d != null ? `<span class="delta ${x.d > 0 ? "up" : "down"}">${x.d > 0 ? "+" : "−"}${Math.abs(x.d).toLocaleString("pt-BR")} vs ago.</span>` : "";
    const cut = opts.cut != null ? `<span class="cut" style="left:${opts.cut / max * 100}%" title="Corte das duas vagas"></span>` : "";
    return `<div class="bar-row">
      <span class="who"><button class="nm" data-person="${x.id}">${esc(x.nome)}</button><small>${flag(x.partido)}${x.lidera ? ' <span class="pill lead sm">LIDERA</span>' : ""}</small></span>
      <span class="track" title="${esc(x.nome)}: ${pct(x.v)}"><span class="fill ${x.campo}" style="width:${w}%"></span>${moeHtml}${ghost}${cut}</span>
      <span class="val">${pct(x.v)}${delta}</span></div>`;
  }).join("")}</div>`;
}
function nominalPill(n) {
  return n === "sim" ? '<span class="v yes">Voto nominal</span>' : n === "parcial" ? '<span class="v abs">Parcial / comissão</span>' : '<span class="v off">Sem voto nominal</span>';
}

function voteBreakdown(key) {
  const groups = {};
  FEDERAIS.forEach(f => { if (!f.t || !(key in f.t)) return; const val = f.t[key]; const c = vcat(key, val); (groups[c] = groups[c] || []).push({ f, val }); });
  const lbl = CAT_LABEL[key] || CAT_LABEL.def;
  const order = ["yes", "no", "abs", "off", "cit", "txt"];
  const total = order.reduce((a, c) => a + (groups[c] ? groups[c].length : 0), 0);
  const colorVar = { yes: "--yes", no: "--no", abs: "--abs", off: "--off", cit: "--abs", txt: "--nd" };
  const stack = total ? `<div class="stack" aria-hidden="true">${order.filter(c => groups[c]).map(c => `<span style="width:${groups[c].length / total * 100}%;background:var(${colorVar[c]})"></span>`).join("")}</div>` : "";
  const cols = order.filter(c => groups[c]).map(c => `<div class="vcol"><h4><span>${esc(lbl[c] || CAT_LABEL.def[c])}</span><span class="num">${groups[c].length}</span></h4><div class="names">${groups[c].map(({ f, val }) => {
    const plain = /^(Sim|Não|Citado|Ausente|Não votou|Abstenção|Não assinou)$/.test(val);
    return personLink(slug(f.nome), f.nome, plain ? "" : val);
  }).join("")}</div></div>`).join("");
  return `<div class="block"><h3>${esc(VKEYS[key].t)} — deputados federais</h3>${stack}<div class="votes-cols">${cols}</div>${groups.dash ? `<p class="sr-names">"—" (não integrava a comissão ou não aparece na lista publicada): ${groups.dash.map(x => esc(x.f.nome)).join(", ")}.</p>` : ""}</div>`;
}
function listVotes(key) {
  const v = VOTACOES[key]; if (!v) return "";
  const colorVar = { yes: "--yes", no: "--no", abs: "--abs", off: "--off" };
  const total = v.grupos.reduce((a, g) => a + g.nomes.length, 0);
  const stack = total ? `<div class="stack" aria-hidden="true">${v.grupos.map(g => `<span style="width:${g.nomes.length / total * 100}%;background:var(${colorVar[g.k]})"></span>`).join("")}</div>` : "";

    <div class="block-head"><h3>${esc(v.titulo)}</h3><span class="count">${esc(v.casa)} · ${esc(v.data)} · ${esc(v.placar)}</span></div>
    <p class="prose">${md(v.intro)}</p>${stack}

function pautaPositions(p) {

        <div class="card prose flow"><h3>Leitura do relatório</h3><ul>${PROD_LEITURA.map(l => `<li>${md(l)}</li>`).join("")}</ul></div>`;

function cellClass(t) {
  if (t === "—") return "dash";
  if (/^S\/R/.test(t)) return "sr";
  if (/Citado/.test(t)) return "cit";
  if (/^(Contra|Antifacção: não)/.test(t) || /Contra a publicidade/.test(t)) return "no";
  if (/^(A favor|Sim|Favorável|Relator, a favor|Chapa pró|Governo pró|Pró-|Antifacção: sim|Defende|Partido: sim|Vê as facções|Pautou|Articulou|Pediu|PT propõe)/.test(t)) return "yes";
  if (/^(Ausente|Não consta|Não verificado)/.test(t)) return "off";
  return "txt";
}

  const campoOfRow = r => { if (r[0] && PEOPLE.get(r[0])) return PEOPLE.get(r[0]).campo || "nd"; if (/PT, PCdoB/.test(r[2])) return "gov"; return "nd"; };

      if (i < 4) return `<td>${i === 1 ? flag(v) : esc(v)}</td>`;

    }).join("")}</tr>`).join("") || `<tr><td colspan="12" class="muted">Nenhuma linha corresponde aos filtros.</td></tr>`;

  $("#mr").addEventListener("click", () => { ["mq", "mp", "me", "mc", "mt"].forEach(id => $("#" + id).value = ""); $("#mt").dispatchEvent(new Event("change")); });

function voteEntries(k) {
  const m = VMETA[k];
  if (m.type === "t") {
    const lbl = Object.assign({}, CAT_LABEL.def, CAT_LABEL[k] || {}, { dash: k === "bets" ? "Não citado" : "— Não integrava / sem registro" });
    return FEDERAIS.filter(f => f.t && k in f.t).map(f => {
      const val = f.t[k], cat = vcat(k, val);
      return { id: slug(f.nome), nome: f.nome, partido: f.partido, campo: f.campo, cat, rot: lbl[cat], det: /^(Sim|Não|Citado|Ausente|Não votou|Abstenção|Não assinou|—)$/.test(val) ? "" : val };
    });
  }
  if (m.type === "l") {
    const out = [];
    VOTACOES[k].grupos.forEach(g => g.nomes.forEach(n => {
      const [nome, nota] = n.split("|"); const p = PEOPLE.get(slug(nome));
      out.push({ id: slug(nome), nome, partido: p ? p.sigla : "", campo: p ? (p.campo || "nd") : "nd", cat: g.k, rot: g.rot, det: nota || "" });
    }));
    (VOTACOES[k].senado || []).forEach(([nome, rot, cat, id]) => { const p = PEOPLE.get(id); out.push({ id, nome, partido: p.sigla, campo: p.campo, cat, rot, det: "Senado" }); });
    return out;
  }
  return [];
}

function allLinks() {
  const seen = new Map();
  const add = (u, t) => { if (!seen.has(u)) seen.set(u, new Set()); seen.get(u).add(t); };
  const walk = v => { if (typeof v === "string") v.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (m, t, u) => { add(u, t); return m; }); else if (Array.isArray(v)) v.forEach(walk); else if (v && typeof v === "object") Object.values(v).forEach(walk); };
  MENORES.fontes.forEach(([t, u]) => add(u, t));
  [MENORES, RESUMO, POLLS, GRUPO_INTRO, PAUTAS, PERFIS, FED_REGRAS, FED_GRUPOS, FED_INTRO, FEDERAIS, PROD_FONTE, SEN_PROD, EST_INTRO, ESTADUAIS, ESTREANTES_TXT, ALBA_PROD, VOTACOES, EMPRESTIMOS].forEach(walk);
  FONTES.forEach(g => g.itens.forEach(([t, u]) => add(u, t)));
  POLLS.gov.outros.forEach(o => add(o.url, o.inst));
  return Array.from(seen.entries()).map(([u, ts]) => ({ u, ts: Array.from(ts), host: u.replace(/^https?:\/\/(www\d*\.)?/, "").split("/")[0] })).sort((a, b) => a.host.localeCompare(b.host) || a.u.localeCompare(b.u));
}

    }],
    ["todas", "Todas as fontes citadas", b => {
      const links = allLinks();
      b.innerHTML = `<div class="block-head"><div class="fld"><label for="sq">Filtrar fontes</label><input id="sq" type="search" placeholder="Ex.: bahianoticias, senado…"></div><span class="count">${links.length} endereços únicos</span></div>
        <ol class="src-list" id="srcList">${links.map(l => `<li data-s="${esc(norm(l.u + " " + l.ts.join(" ")))}"><a href="${l.u}" target="_blank" rel="noopener">${esc(l.ts.join(" · "))}</a> <span class="muted mono xs">${esc(l.host)}</span></li>`).join("")}</ol>`;
      $("#sq").addEventListener("input", e => { const q = norm(e.target.value); $$("#srcList li").forEach(li => li.hidden = q && !li.dataset.s.includes(q)); });
    }]
  ]);
}

/* ================= CANDIDATOS MENORES ================= */
function renderMenores() {
  const el = $("#sec-menores");
  el.innerHTML = `${secHead("Candidatos menores", `Os dez candidatos que pontuam entre 0,3% e 3,8%: quatro ao governo e seis ao Senado. Dados do relatório complementar de ${esc(MENORES.data)}.`)}<div id="menTabs"></div>`;
  const tabela = ids => `<div class="tbl-wrap"><table><thead><tr><th>Candidato</th><th>Partido</th><th>Chapa</th><th class="n">Pesquisa</th><th>Perfil</th><th class="n">Bens</th></tr></thead><tbody>${ids.map(id => { const p = PEOPLE.get(id), m = p.menor; return `<tr><td><button class="nm" type="button" data-person="${id}">${esc(p.nome)}</button></td><td>${flag(p.sigla)}</td><td class="small">${esc(m.chapa || "—")}</td><td class="n">${esc(m.pesquisa)}</td><td class="small">${esc(m.perfil)}</td><td class="n">${esc(m.bens)}</td></tr>`; }).join("")}</tbody></table></div>`;
  const cards = ids => `<div class="people">${ids.map(id => { const p = PEOPLE.get(id), m = p.menor; const tem = [m.declaracoes && "declarações", m.propostas && "propostas", m.partido && "linha do partido"].filter(Boolean); return `<button class="person" type="button" data-person="${id}"><span class="pn"><i class="dot out"></i>${esc(p.nome)}</span><span class="pm">${flag(p.sigla)}<span class="pill tag">${esc(m.pesquisa)}</span><span class="pill tag">Bens: ${esc(m.bens)}</span></span><span class="ps">${esc(plain(m.trajetoria))}</span><span class="muted xs">${tem.length ? "Tem " + tem.join(", ") : "Sem propostas nem declarações localizadas"}</span></button>`; }).join("")}</div>`;
  TABSEL.menores = subTabs($("#menTabs"), "menores", [
    ["resumo", "Resumo", b => {
      b.innerHTML = `<div class="card prose flow"><p>${md(MENORES.resumo)}</p><p>${md(MENORES.contexto)}</p><p><strong>Em uma frase:</strong> ${md(MENORES.frase)}</p></div>
        <div class="grid2"><div class="card flow"><h3>Governo da Bahia</h3>${pollBars(POLLS.gov.set.slice(2), { max: 5 })}</div><div class="card flow"><h3>Senado</h3>${pollBars(POLLS.sen.set.slice(4), { max: 5 })}</div></div>
        <p class="muted small">Escala ampliada (0 a 5%) para comparar os candidatos menores entre si.</p>`;
    }],
    ["gov", `Governo <span class="tcount">${MENORES.gov.length}</span>`, b => { b.innerHTML = tabela(MENORES.gov) + `<h3>Perfis</h3>` + cards(MENORES.gov); }],
    ["sen", `Senado <span class="tcount">${MENORES.sen.length}</span>`, b => { b.innerHTML = tabela(MENORES.sen) + `<h3>Perfis</h3>` + cards(MENORES.sen); }],
    ["opiniao", "Opinião pública", b => {
      b.innerHTML = `<p class="prose muted">${md(MENORES.opiniao.intro)}</p><div class="grid2">${MENORES.opiniao.linhas.map(l => `<div class="card">${opRow(l)}<div class="names mt">${l.ids.map(id => personLink(id)).join("")}</div></div>`).join("")}</div><p class="note"><strong>Leitura.</strong> ${md(MENORES.opiniao.leitura)}</p>`;
    }],
    ["lacunas", "Lacunas e fontes", b => {
      b.innerHTML = `<div class="grid2"><div class="card prose flow"><h3>Lacunas</h3><ul>${MENORES.lacunas.map(l => `<li>${md(l)}</li>`).join("")}</ul></div>
        <div class="card flow"><h3>Fontes</h3><ul class="small">${MENORES.fontes.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("")}</ul><p class="muted small">As demais fontes estão em cada candidato e na tabela de opinião pública.</p></div></div>`;
    }]
  ]);
}

const RENDER = { visao: renderVisao, pautas: renderPautas, politicos: renderPoliticos, menores: renderMenores, produtividade: renderProdutividade, matriz: renderMatriz, votacoes: renderVotacoes, metodo: renderMetodo };

/* ================= busca global ================= */
const IDX = [];
PEOPLE.forEach(p => IDX.push({ kind: "Político", label: p.nome + (p.apelido ? ` (${p.apelido})` : ""), sub: `${p.sigla} · ${CARGOS[p.cargo]}`, s: norm([p.nome, p.apelido, p.partido, p.sigla, CARGOS[p.cargo]].join(" ")), act: () => openProfile(p.id), campo: p.campo || "nd" }));
PAUTAS.forEach(p => IDX.push({ kind: "Pauta", label: p.titulo, sub: p.ref, s: norm([p.titulo, p.ref, p.propoe].join(" ")), act: () => openPauta(p.id) }));
[["visao", "Pesquisas para governador e Senado"], ["menores", "Candidatos menores: bens, propostas e opinião pública"],["produtividade", "Produtividade e assiduidade"], ["matriz", "Matriz comparativa"], ["votacoes", "Votações nominais e AL-BA"], ["metodo", "Fontes e limites do estudo"]].forEach(([k, t]) => IDX.push({ kind: "Seção", label: t, sub: "", s: norm(t), act: () => go(k) }));
const gq = $("#gq"), gr = $("#gresults"); let hits = [], hi = 0;
function drawHits() {
  gr.innerHTML = hits.length ? hits.map((h, i) => `<button type="button" data-i="${i}" class="${i === hi ? "hl" : ""}">${h.campo ? `<i class="dot ${h.campo}"></i>` : ""}<span><strong>${esc(h.label)}</strong>${h.sub ? `<br><small class="muted">${esc(h.sub)}</small>` : ""}</span><span class="kind">${h.kind}</span></button>`).join("") : `<div class="empty">Nada encontrado. Tente um sobrenome, sigla de partido ou tema (ex.: "armas").</div>`;
  gr.hidden = false;
}
gq.addEventListener("input", () => {
  const q = norm(gq.value.trim()); if (!q) { gr.hidden = true; return; }
  const terms = q.split(/\s+/);
  hits = IDX.filter(x => terms.every(t => x.s.includes(t))).sort((a, b) => (a.s.startsWith(q) ? 0 : 1) - (b.s.startsWith(q) ? 0 : 1)).slice(0, 14); hi = 0; drawHits();
});
gq.addEventListener("keydown", e => {
  if (gr.hidden) return;
  if (e.key === "ArrowDown") { hi = Math.min(hits.length - 1, hi + 1); drawHits(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { hi = Math.max(0, hi - 1); drawHits(); e.preventDefault(); }
  else if (e.key === "Enter" && hits[hi]) { pick(hi); e.preventDefault(); }
  else if (e.key === "Escape") gr.hidden = true;
});
function pick(i) { const h = hits[i]; gr.hidden = true; gq.value = ""; h.act(); }
gr.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) pick(+b.dataset.i); });
document.addEventListener("click", e => { if (!e.target.closest(".gsearch")) gr.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !dlg.open) { e.preventDefault(); gq.focus(); } });

/* ================= início ================= */
let start = "visao";
try { const h = location.hash.slice(1); if (SECS.includes(h)) start = h; else if (SECS.includes(store("ba26-sec"))) start = store("ba26-sec"); } catch (e) {}
show(start);
})();

</script>
